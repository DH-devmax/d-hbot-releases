name: Build DH BOT production
run-name: DH BOT production ${{ inputs.release_tag }} from ${{ inputs.source_commit }}

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "DH-devmax/d-hbot 中已完成本地验收的 40 位 commit SHA"
        required: true
        type: string
      release_tag:
        description: "公开版本标签，例如 v3.0.0 或 v3.0.0-beta.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: dh-bot-production-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout release repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate release request and required secrets
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_READ_TOKEN: ${{ secrets.DH_SOURCE_READ_TOKEN }}
          SIGN_PFX_B64: ${{ secrets.DH_SIGN_PFX_B64 }}
          SIGN_PASSWORD: ${{ secrets.DH_SIGN_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "生产 workflow 只允许从发行仓库 main 分支运行，当前为 $env:GITHUB_REF"
          }
          if ($env:SOURCE_COMMIT -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'source_commit 必须是完整的 40 位十六进制 commit SHA'
          }
          if ($env:RELEASE_TAG -notmatch '^v3\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw 'release_tag 格式必须是 v3.x.y 或 v3.x.y-prerelease'
          }
          if ([string]::IsNullOrWhiteSpace($env:SOURCE_READ_TOKEN)) {
            throw '缺少 DH_SOURCE_READ_TOKEN'
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGN_PFX_B64)) {
            throw '缺少 DH_SIGN_PFX_B64'
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGN_PASSWORD)) {
            throw '缺少 DH_SIGN_PASSWORD'
          }
          & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "公开 Release 已存在：$env:RELEASE_TAG" }
          & gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) { throw "公开标签已存在：$env:RELEASE_TAG" }

      - name: Checkout exact private source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: DH-devmax/d-hbot
          ref: ${{ inputs.source_commit }}
          token: ${{ secrets.DH_SOURCE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source identity and application version
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git -C source rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:SOURCE_COMMIT.ToLowerInvariant()) {
            throw "源码提交不一致：期望 $env:SOURCE_COMMIT，实际 $actual"
          }
          $package = Get-Content source\tauri3\package.json -Raw | ConvertFrom-Json
          $tagVersion = $env:RELEASE_TAG.Substring(1)
          if ([string]$package.version -ne $tagVersion) {
            throw "应用版本 $($package.version) 与标签 $tagVersion 不一致"
          }

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Setup Rust and pnpm
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          npm install --global pnpm@11.15.1

      - name: Install locked dependencies
        shell: pwsh
        working-directory: source/tauri3
        run: pnpm install --frozen-lockfile

      - name: Verify production boundary and contracts
        shell: pwsh
        working-directory: source/tauri3
        run: |
          pnpm verify:production:boundary
          pnpm test:production-isolation
          pnpm test:contract-sanitizer

      - name: Test production Rust and React
        shell: pwsh
        working-directory: source/tauri3
        run: |
          pnpm test:production
          pnpm test:ui
          cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets -- -D warnings

      - name: Build production PE without bundling
        shell: pwsh
        working-directory: source/tauri3
        run: |
          pnpm clean:production
          pnpm exec tauri build --no-bundle --ci --features custom-protocol -- --no-default-features

      - name: Sign and verify production PE
        shell: pwsh
        env:
          SIGN_PFX_B64: ${{ secrets.DH_SIGN_PFX_B64 }}
          SIGN_PASSWORD: ${{ secrets.DH_SIGN_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'dh-bot-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_B64))
            $exe = Join-Path $env:GITHUB_WORKSPACE 'source\tauri3\src-tauri\target\release\dh-bot.exe'
            & signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:SIGN_PASSWORD $exe
            if ($LASTEXITCODE -ne 0) { throw '主程序 Authenticode 签名失败' }
            & signtool verify /pa /all $exe
            if ($LASTEXITCODE -ne 0) { throw '主程序 Authenticode 校验失败' }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Bundle NSIS with signed production PE
        shell: pwsh
        working-directory: source/tauri3
        run: pnpm exec tauri bundle --ci --no-sign --features custom-protocol

      - name: Sign and verify NSIS installers
        shell: pwsh
        env:
          SIGN_PFX_B64: ${{ secrets.DH_SIGN_PFX_B64 }}
          SIGN_PASSWORD: ${{ secrets.DH_SIGN_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'dh-bot-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_B64))
            $nsis = Join-Path $env:GITHUB_WORKSPACE 'source\tauri3\src-tauri\target\release\bundle\nsis'
            $installers = @(Get-ChildItem $nsis -File -Filter '*.exe')
            if ($installers.Count -eq 0) { throw '没有找到 NSIS 安装器' }
            foreach ($installer in $installers) {
              & signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:SIGN_PASSWORD $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "安装包 Authenticode 签名失败：$($installer.Name)" }
              & signtool verify /pa /all $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "安装包 Authenticode 校验失败：$($installer.Name)" }
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Package and deeply scan signed production artifacts
        shell: pwsh
        working-directory: source/tauri3
        env:
          DH_RELEASE_REQUIRE_SIGNATURE: '1'
          DH_RELEASE_PRE_SIGNED: '1'
          DH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          pnpm package:windows:production
          pnpm verify:windows:production

      - name: Generate public release manifest
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'source\tauri3\dist\production'
          $portable = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'source\tauri3\dist') -File -Filter 'DH-BOT-*-windows-x64-portable.zip' | Select-Object -First 1
          if (-not $portable) { throw '缺少 portable ZIP' }
          $payload = @(
            Get-ChildItem $dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' }
            $portable
          )
          $manifestFiles = @($payload | Sort-Object Name | ForEach-Object {
            [ordered]@{
              name = $_.Name
              size = $_.Length
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          $manifest = [ordered]@{
            schema = 1
            releaseTag = $env:RELEASE_TAG
            sourceRepository = 'DH-devmax/d-hbot'
            sourceCommit = $env:SOURCE_COMMIT.ToLowerInvariant()
            buildChannel = 'production'
            createdAt = [DateTime]::UtcNow.ToString('o')
            files = $manifestFiles
          }
          $manifestPath = Join-Path $dist 'DH-BOT-release.json'
          $manifest | ConvertTo-Json -Depth 5 | Set-Content $manifestPath -Encoding utf8
          $manifestHash = (Get-FileHash $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content (Join-Path $dist 'SHA256SUMS.txt') "$manifestHash  DH-BOT-release.json" -Encoding ascii

      - name: Create public GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'source\tauri3\dist\production'
          $portable = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'source\tauri3\dist') -File -Filter 'DH-BOT-*-windows-x64-portable.zip' | Select-Object -First 1
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @"
          生产构建来源：DH-devmax/d-hbot@$env:SOURCE_COMMIT

          本版本由公开发行仓库的 Windows 生产 workflow 构建、签名并完成生产隔离扫描。请使用同一 Release 中的 SHA256SUMS.txt 校验下载文件。
          "@ | Set-Content $notes -Encoding utf8
          $assets = @(
            Get-ChildItem $dist -File | Where-Object { $_.Extension -in '.exe', '.md', '.pdf', '.json', '.txt' } | Select-Object -ExpandProperty FullName
            $portable.FullName
          )
          $arguments = @('release', 'create', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY, '--target', 'main', '--title', "DH BOT $env:RELEASE_TAG", '--notes-file', $notes)
          if ($env:RELEASE_TAG.Contains('-')) { $arguments += '--prerelease' }
          $arguments += $assets
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw '创建公开 GitHub Release 失败' }
